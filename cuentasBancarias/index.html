<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuentas Bancarias</title>
    <link rel="stylesheet" href="./estilo.css">
</head>
<body>
    <div id="modulo-cuentas">
        <div id="portada">
            <h1>Cuentas Bancarias</h1>
            <p>Aprende qué son, cómo funcionan y cómo abrir tu primera cuenta de ahorro.</p>
            <button id="btn-iniciar-modulo" onclick="iniciarModulo()">Comenzar módulo</button>
        </div>

        <div id="teoria" style="display: none;">
            <h2>Teoria - Nivel 1</h2>
                <div id="contenido-teorico"></div>
                <button id="btn-ir-preg" onclick="iniciarPreguntas()">Ir a preguntas</button>
        </div>


            


            <div id="preguntas" style="display: none;">
                <div id="contenedor-barra">
                    <div id="barra-progreso"></div>
                    <p id="porcentaje">0%</p>
                </div>

                <h3 id="pregunta"></h3>
            
                <ul id="lista-opciones"></ul>
                <div id="retro"></div>
                <p id="puntaje"></p>
                <button id="btn-verificar" onclick="verificar()">Comprobar</button>
                <button id="btn-siguiente" onclick="mostrarPregunta()" style="display:none;">Siguiente</button>
            </div>
    </div>
    
</body>
<script src="./cuentasBancarias.js"></script>
</html>
