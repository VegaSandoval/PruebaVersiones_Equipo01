<html lang="en">

    <title>Formulario del lider</title>
</head>
<body>
    <form action="" name="formulario" method="get" id="form">
        <p>¿Te agrada el líder?</p>

        <label>
            <input type="checkbox" name="lider" value="1">
            Sí
        </label><br>

        <label>
            <input type="checkbox" name="lider" value="2">
            Sí, me agrada bastante
        </label><br>

        <label>
            <input type="checkbox" name="lider" value="3">
            Sí, me agrada mucho
        </label><br>

        <label>
            <input type="checkbox" name="lider" value="4">
            Sí, me inspira completamente
        </label><br>

        <label>
            <input type="checkbox" name="lider" value="5">
            Sí, es la mejor persona que he conocido
        </label><br>

        <br>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
